<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friglog | Unidades</title>

    <link rel="stylesheet" href="style.css">

    <script src="../js/sessao.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="sidebar">
        <div class="logo">
            <a href="../index.html" class="logo-link">
                <div class="logo-row">
                    <img class="logo-icon" src="./iconlogo.png" alt="Logo">
                    <div class="logo-text">
                        <span class="blue">FRIGO</span><span class="red">LOG</span>
                    </div>
                </div>
            </a>

            <div class="logo-badge">
                CONTROLE TÉRMICO DE PONTA A PONTA
            </div>
        </div>

        <div class="menu-item" onclick="window.location.href='./dashboard.html'">
            <span class="icon">📊</span>
            <span class="text">Dashboard Geral</span>
        </div>

        <div class="menu-item menu-ativo">
            <span class="icon">🧊</span>
            <span class="text">Ambientes</span>
        </div>

         <div class="menu-item nome" onclick="window.location='./adm_empresa.html'" id="menuitem_admin">
            <span class="icon">👨‍💻</span>
            <span class="text">Administrador</span>
        </div>

        <div class="logout-btn" onclick="logout()">
            <span class="icon">⎋</span>
            <span class="text">Sair</span>
        </div>
    </div>

    <div class="conteudo-geral">
        <div class="subconteudo" id="conteudoAmbientes">
            <h1 class="conteudo-title">Selecione uma unidade para analisar os Pontos Operacionais</h1>
            <input type="text" id="ipt_busca" placeholder="Buscar o nome de um ambiente..."
                oninput="filtrarAmbientes()">
            <div class="unidade-list" id="id_lista_ambientes">

            </div>
        </div>

        <div class="subconteudo" id="conteudoPO">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <h1 class="conteudo-title">Selecione um PO para ver detalhes </h1>
                <button onclick="listarAmbientes()">Voltar</button>
            </div>
            <input type="text" id="ipt_busca_po" placeholder="Buscar o nome de um Ponto Operacional..."
                oninput="filtrarPO()">
            <div class="unidade-list" id="id_lista_po">

            </div>
        </div>

        <div class="subconteudo" id="dashboardPO">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 100px;">
                <h1 id="nome_po" style="font-size: 40px; font-family: Arial, Helvetica, sans-serif; color: #fff;">PO</h1>

                <div style="display: flex; align-items: center; justify-content: space-around; width: 60%;">
                    <div class="kpis" style="width: 80%;">
                        <!-- Temperatura atual -->
                        <div class="kpi-card otimo" id="kpi_card_temperatura">
                            <div class="kpi-bar"></div>
                            <h3>Temperatura atual</h3>
                            <p id="kpi_temperatura_atual">0</p>
                        </div>

                        <!-- Alertas gerados-->
                        <div class="kpi-card critico" id="kpi_card_alertas">
                            <div class="kpi-bar"></div>
                            <h3>Alertas nas Últimas 24h</h3>
                            <p id="kpi_total_alertas">0</p>
                        </div>
                    </div>

                    <button onclick="voltarPO()">Voltar</button>
                </div>
            </div>

            <div style="height: 60vh;">
                <canvas id="grafico_temperatura" style="background-color: aliceblue;"></canvas>
            </div>
        </div>
    </div>
</body>
<script>

    if(sessionStorage.TIPO_USUARIO == "admin_empresa") {
        menuitem_admin.classList.remove("nome")
     };

    let ambientes = [];
    let pos = [];
    let ambientePO = 0;
    let graficoTemperatura = null;

    listarAmbientes()
    async function listarAmbientes() {
        conteudoPO.style.display = "none";
        dashboardPO.style.display = "none";
        id_lista_ambientes.innerHTML = ``;


        let resposta = await fetch(`/empresas/listarAmbientes/${sessionStorage.ID_EMPRESA}`)
        ambientes = await resposta.json()
        console.log(ambientes);

        renderizarAmbientes(ambientes);
    }

    function renderizarAmbientes(lista) {
        id_lista_ambientes.innerHTML = ``;

        for (let i = 0; i < lista.length; i++) {
            let ambiente_card = `
            <div class="kpi-card" style="cursor: pointer;" onclick="abrirPO(${lista[i].id_ambiente})">
                <span>${lista[i].nome}</span>
                <span>CEP: ${lista[i].cep} | N°: ${lista[i].numero}</span>
            </div>
            `;

            id_lista_ambientes.innerHTML += ambiente_card;
        }

        conteudoAmbientes.style.display = "block";
    }

    function filtrarAmbientes() {
        let nome_ipt = ipt_busca.value;
        let ambientes_filtrados = [];

        for (let i = 0; i < ambientes.length; i++) {
            if (ambientes[i].nome.toLowerCase().includes(nome_ipt.toLowerCase())) {
                ambientes_filtrados.push(ambientes[i]);
            }

        }

        renderizarAmbientes(ambientes_filtrados);

    }

    async function abrirPO(id_ambiente) {
        conteudoAmbientes.style.display = "none";
        dashboardPO.style.display = "none";

        ambientePO = id_ambiente;

        id_lista_po.innerHTML = ``;


        let resposta = await fetch(`/empresas/listarPOs/${id_ambiente}`)
        pos = await resposta.json()
        console.log(pos);

        renderizarPO(pos);

    }

    function renderizarPO(listaPO) {
        id_lista_po.innerHTML = ``;

        for (let i = 0; i < pos.length; i++) {
            let po_card = `
            <div class="kpi-card" style="cursor: pointer;" onclick="detalharPO(${listaPO[i].id_ponto_operacional})">
                <span>${listaPO[i].nome}</span>
            </div>
            `;

            id_lista_po.innerHTML += po_card;
        }


        conteudoPO.style.display = "block";
    }


    function filtrarPO() {
        let nome_ipt = ipt_busca_po.value;
        let pos_filtrados = [];

        for (let i = 0; i < pos.length; i++) {
            if (pos[i].nome.toLowerCase().includes(nome_ipt.toLowerCase())) {
                pos_filtrados.push(pos[i]);
            }

        }

        renderizarPO(pos_filtrados);

    }

    async function detalharPO(id_po) {
        conteudoPO.style.display = "none";
        dashboardPO.style.display = "block";

        const resTemp = await fetch("/leituras/temperaturas_po/" + id_po);
        const temperaturas = await resTemp.json();

        const resAlertas = await fetch("/leituras/alertas_po/" + id_po);
        const alertas = await resAlertas.json();

        renderizarDashPO(temperaturas, alertas);
    }

    function corPorTemperatura(valor, temp_min, temp_max) {
        if ((valor - temp_max) >= 5 || (temp_min - valor) >= 5) {
            // Critico
            return "#e74c3c";
        }
        else if (((valor - temp_max) >= 3 || (temp_min - valor) >= 3)) {
            // Alerta
            return "#f1c40f";
        }
        else {
            // Normal
            return "#2ecc71";
        }
    }

    function renderizarDashPO(temp, alertas) {
        nome_po.innerHTML = `${temp[0].ponto_operacional}`;

        const temperaturas = [];
        const data_hora = [];
        const temp_min = temp[0].temp_min;
        const temp_max = temp[0].temp_max;

        for (let i = 0; i < temp.length; i++) {
            temperaturas.push(Number(temp[i].temperatura));
            data_hora.push(temp[i].data_hora);
        }

        const ultima_temperatura = temperaturas[temperaturas.length - 1];
        kpi_temperatura_atual.innerHTML = ultima_temperatura;

        if ((ultima_temperatura - temp_max) >= 5 || (temp_min - ultima_temperatura) >= 5) {
            // Critico
            kpi_card_temperatura.className = "kpi-card critico";
        }
        else if (((ultima_temperatura - temp_max) >= 3 || (temp_min - ultima_temperatura) >= 3)) {
            // Alerta
            kpi_card_temperatura.className = "kpi-card alerta";
        }
        else {
            // Normal
            kpi_card_temperatura.className = "kpi-card otimo";
        }

        const qtd_alertas = alertas[0].total_alertas;
        kpi_total_alertas.innerHTML = qtd_alertas;

        if (qtd_alertas > 10) {
            kpi_card_alertas.className = "kpi-card critico";
        }
        else if (qtd_alertas > 5) {
            kpi_card_alertas.className = "kpi-card alerta";
        }
        else {
            kpi_card_alertas.className = "kpi-card otimo";
        }

        if (graficoTemperatura != null) {
            graficoTemperatura.datasets.data = temperaturas;
            graficoTemperatura.update();
        }
        else {
            const ctxTemperatura = document.getElementById("grafico_temperatura");
            graficoTemperatura = new Chart(ctxTemperatura, {
                type: 'line',
                data: {
                    labels: data_hora,
                    datasets: [{
                        label: "Temperaturas",
                        data: temperaturas,
                        borderColor: '#2ecc71',

                        segment: {
                            borderColor: ctx => {
                                const proximoValor = ctx.p1.parsed.y;
                                return corPorTemperatura(proximoValor, temp_min, temp_max);
                            }
                        },

                        pointBackgroundColor: temperaturas.map(valor => corPorTemperatura(valor, temp_min, temp_max)),
                        pointBorderColor: temperaturas.map(valor => corPorTemperatura(valor, temp_min, temp_max)),

                        pointRadius: 6,
                        pointHoverRadius: 8,
                        borderWidth: 3,
                        tension: 0.4,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            min: -20,
                            max: 20,
                            ticks: {
                                font: {
                                    size: 16
                                }
                            }
                        },
                        x: {
                            ticks: {
                                font: {
                                    size: 20
                                }
                            }
                        }
                    }
                }
            });
        }
    }

    function voltarPO() {
        if (graficoTemperatura != null) {
            graficoTemperatura.destroy();
            graficoTemperatura = null;
        }

        abrirPO(ambientePO);
    }


    function logout() {
        window.location.href = "../../index.html"
    }
</script>

</html>
